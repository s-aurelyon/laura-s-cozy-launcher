name: Build Cozy APK

on:
  push:
  workflow_dispatch:

# Needed to publish the APK on the repository's Releases page.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch fonts
        run: bash scripts/fetch-fonts.sh

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Cozy.apk

      # Releases don't count towards the Actions storage limit, and the newest one
      # is always at  github.com/<you>/<repo>/releases/latest
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cozy build ${{ github.run_number }}
          body: Download Cozy.apk below and open it on the tablet to install or update.
          files: Cozy.apk
          make_latest: true
